name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck and validate registry
        run: bun run check

      - name: Accessibility tests
        run: bun test

      # Prerenders every page and writes the registry, feeds and social cards,
      # so a page or endpoint that fails to build fails CI.
      - name: Build static site
        run: bun run build
